name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Run offline tests against the installed wheel
        run: pytest -o pythonpath=
        env:
          HF_HUB_OFFLINE: "1"
          HF_HOME: ${{ runner.temp }}/huggingface
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-python-${{ matrix.python }}
          retention-days: 90
          path: |
            dist/*.whl
            dist/*.tar.gz
