[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephris"
version = "1.0.1"
description = "Pretrained graph in-context learning for node classification"
dynamic = ["readme"]
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Nums AI Inc.", email = "contact@nums.world"}]
dependencies = ["torch==2.11.0", "torch-geometric==2.8.0", "numpy", "huggingface-hub==1.20.1"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/nums-ai/ephris"
Issues = "https://github.com/nums-ai/ephris/issues"
Models = "https://huggingface.co/nums-ai/ephris"
Documentation = "https://github.com/nums-ai/ephris/blob/main/docs/inference.md"

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.6.4",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "ipywidgets==8.1.9",
    "matplotlib==3.11.0",
    "scikit-learn==1.9.0",
]
test = ["pytest", "scikit-learn==1.9.0"]
dev = ["pytest", "ruff==0.11.13", "build", "twine", "matplotlib==3.11.0", "scikit-learn==1.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not pretrained'"
markers = ["pretrained: requires access to the official model weights"]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ephris"]

[tool.setuptools.packages.find]
where = ["src"]
